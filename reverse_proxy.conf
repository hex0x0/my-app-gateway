server {
    listen 10443 ssl;
    server_name api.hex0x0.site;

    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    resolver 119.29.29.29 8.8.8.8 [2001:4860:4860::8888] valid=60s;
    resolver_timeout 5s;

    # Without variable-based proxying, NGINX resolves once at startup, DDNS IP changes cause stale upstreams.
    set $dn "shadow-server.hex0x0.site";
    set $port "9000";

    location / {
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://$dn:$port;
    }
}
